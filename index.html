<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ЗАМОК//07 — v1.4</title>
<style>
:root{
  --bg:#050805; --panel:#071007; --panel2:#0b160b; --line:#1f4a22;
  --text:#8cff8c; --muted:#4e8b52; --white:#b7ffb7; --ok:#b7ffb7;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{
  min-height:100vh; display:flex; justify-content:center; align-items:flex-start;
  padding:14px 10px 24px;
  background:
    radial-gradient(circle at 50% 12%,#25292d 0,#121416 28%,#090a0b 62%);
}
.app{width:min(900px,100%);}
.header{
  border:1px solid #30343a; background:linear-gradient(#171a1d,#101214);
  padding:12px 14px; position:relative; overflow:hidden;
  box-shadow:0 12px 35px #000, inset 0 1px #69ff6918, 0 0 28px #18ff1810;
}
.header:before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#69ff69; box-shadow:0 0 10px #69ff6966;
}
.brand{font-weight:900;letter-spacing:4px;font-size:21px}
.sub{margin-top:3px;color:#4e9a52;font-size:10px;letter-spacing:2px}
.statusbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.badge{
  border:1px solid #3b4045;background:#030803;padding:6px 9px;
  font-size:10px;letter-spacing:1px;color:#67bd69;
}
.badge strong{color:#8cff8c}
.module{
  margin-top:10px;border:1px solid #34383d;background:#071007;
  box-shadow:0 16px 40px #000, 0 0 25px #1cff1c08;
}
.module-head{
  padding:11px 13px;border-bottom:1px solid #2d3135;
  display:flex;justify-content:space-between;align-items:center;gap:10px;
}
.module-title{font-size:11px;letter-spacing:2px;font-weight:800}
.module-state{font-size:10px;color:#858b91;letter-spacing:1px}
.machine{
  position:relative;padding:18px 12px 20px;
  background:
    linear-gradient(#ffffff03 1px,transparent 1px),
    linear-gradient(90deg,#ffffff03 1px,transparent 1px);
  background-size:24px 24px;
}
.machine-frame{
  border:1px solid #3b4045;padding:18px 12px 16px;
  background:linear-gradient(180deg,#0d1a0e,#050b05);
  position:relative;
}
.machine-frame:before,.machine-frame:after{
  content:"";position:absolute;left:7px;right:7px;height:1px;background:#ffffff0d;
}
.machine-frame:before{top:7px}.machine-frame:after{bottom:7px}
.rails{
  display:grid;grid-template-columns:repeat(5,minmax(48px,1fr));gap:9px;
  max-width:760px;margin:0 auto;position:relative;
}
.rail-wrap{position:relative;min-width:0}
.rail-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;color:#92989d;font-size:10px;letter-spacing:1px}
.rail-label b{color:#d9dcdf;font-size:11px}
.rail{
  position:relative;height:285px;border:1px solid #41464b;background:#020602;
  overflow:hidden;touch-action:none;cursor:pointer;
  box-shadow:inset 0 0 0 3px #020402,inset 0 0 25px #000, inset 0 0 18px #18ff1810;
}
.rail:before{
  content:"";position:absolute;left:50%;top:8px;bottom:8px;width:18px;transform:translateX(-50%);
  border:1px solid #353a3f;background:linear-gradient(90deg,#020502,#123014,#020502);
}
.slot{
  position:absolute;left:50%;transform:translate(-50%,-50%);
  width:42px;height:29px;border:1px solid #1e4c22;background:#061006;
  display:flex;align-items:center;justify-content:center;
}
.slot .num{font-size:8px;color:#36763b}
.slot.work{
  border:2px solid #78ff78;background:#173d19;color:#9cff9c;
  box-shadow:0 0 0 1px #4d9d52,0 0 16px #39ff3955;
}
.slot.work .num{color:#9cff9c;font-weight:900}
.handle{
  position:absolute;left:50%;transform:translate(-50%,-50%);
  width:52px;height:38px;border:1px solid #777d82;
  background:linear-gradient(180deg,#b7ffb7,#2d7d32 43%,#0a200c 44%,#55b85a);
  box-shadow:0 3px 0 #010301,0 0 0 2px #071007,0 0 12px #27ff2733;
  z-index:5;transition:top .13s cubic-bezier(.2,.8,.2,1);
}
.handle:before,.handle:after{
  content:"";position:absolute;top:7px;bottom:7px;width:3px;background:#143e17;
}
.handle:before{left:7px}.handle:after{right:7px}
.handle .center{width:19px;height:5px;background:#071307;border:1px solid #102610;box-shadow:inset 0 1px #fff4}
.okmark{
  position:absolute;right:4px;top:4px;width:17px;height:17px;
  display:none;align-items:center;justify-content:center;background:#69ff69;color:#021002; box-shadow:0 0 10px #39ff3966;
  font-weight:900;font-size:11px;z-index:7;
}
.rail.correct{border-color:#52b957;box-shadow:inset 0 0 0 2px #43ff4322,inset 0 0 28px #20ff2015,0 0 10px #20ff2018;}
.rail.correct .okmark{display:flex}
.rail.correct .handle{border-color:#8cff8c}
.link-layer{position:absolute;left:0;right:0;top:54px;height:285px;pointer-events:none;z-index:3}
.link{
  position:absolute;height:3px;background:#3d8b42; box-shadow:0 0 7px #35ff3533;box-shadow:0 0 0 1px #161819;
  transform-origin:left center;opacity:.9;
}
.link-dot{
  position:absolute;width:10px;height:10px;border:1px solid #999;transform:translate(-50%,-50%);
  background:#071007;border-radius:50%; box-shadow:0 0 8px #35ff3533;
}
.link-text{
  position:absolute;font-size:8px;letter-spacing:1px;color:#4c9651;white-space:nowrap;
  transform:translate(-50%,-50%);background:#071007;padding:2px 4px;
}
.legend{
  display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin-top:15px;color:#438347;
  font-size:9px;letter-spacing:1px;text-transform:uppercase;
}
.legend span{display:flex;align-items:center;gap:5px}
.legend .box{width:13px;height:8px;border:1px solid #fff;background:#69ff69; box-shadow:0 0 7px #39ff3955;}
.legend .line{width:20px;height:2px;background:#3d8b42;}
.controls{
  display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:12px;border-top:1px solid #2d3135;
}
button{
  min-height:46px;border:1px solid #4a4f54;background:#181b1e;color:#e7e9eb;
  font-weight:800;letter-spacing:1px;font-size:11px;cursor:pointer;
}
button:active{transform:translateY(1px)}
button.primary{background:#e8e9ea;color:#031003;border-color:#8cff8c}
button.primary:disabled{opacity:.28;cursor:not-allowed;background:#1d3c1f;color:#3d7040}
.info{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:#163919;
  border-top:1px solid #2d3135;
}
.info-cell{background:#071007;padding:10px 12px}
.info-label{font-size:8px;color:#3e7f43;letter-spacing:1px}
.info-value{font-size:12px;margin-top:3px;font-weight:800}
.message{
  padding:11px 13px;border-top:1px solid #2d3135;color:#4f9c54;
  font-size:10px;line-height:1.5;letter-spacing:.4px;
}
.message.ok{color:#9cff9c}
.message.lockout{
  color:#9cff9c; text-align:center; font-size:16px; font-weight:900;
  letter-spacing:3px; padding:18px 12px;
  border-color:#69ff69;
  background:#0a190b;
  box-shadow:inset 0 0 20px #2dff2d12,0 0 18px #35ff3530;
  text-shadow:0 0 9px #39ff3966;
  animation:lockoutPulse 1s steps(2,end) infinite;
}
@keyframes lockoutPulse{50%{opacity:.55}}
@media(max-width:600px){
  body{padding:8px 6px 18px}
  .timer-top{min-width:92px;padding:5px 7px}
  .timer-top strong{font-size:27px}
  .machine{padding:12px 6px 14px}
  .machine-frame{padding:14px 6px}
  .rails{gap:5px}
  .rail{height:250px}
  .slot{width:35px;height:26px}
  .handle{width:43px;height:34px}
  .handle:before{left:5px}.handle:after{right:5px}
  .link-layer{top:51px;height:250px}
  .link-text{display:none}
  .info{grid-template-columns:1fr 1fr 1fr}
  .info-value{font-size:11px}
}


.timer-top{
  margin-left:auto; min-width:105px; padding:5px 10px;
  border:1px solid #32783a; background:#061006;
  display:flex; align-items:baseline; justify-content:center; gap:6px;
  box-shadow:inset 0 0 12px #1cff1c0b,0 0 12px #1cff1c12;
  color:#63bd68; text-shadow:0 0 7px #36ff3655;
}
.timer-top span{font-size:8px;letter-spacing:1.5px}
.timer-top strong{font-size:31px;line-height:1;color:#9cff9c;letter-spacing:1px}
.timer-top em{font-style:normal;font-size:8px;letter-spacing:1px}
.timer-top.warning{border-color:#76ff76;box-shadow:0 0 15px #39ff3944,inset 0 0 14px #39ff3918}
.timer-top.warning strong{animation:timerPulse .8s steps(2,end) infinite}
@keyframes timerPulse{50%{opacity:.45}}

/* RETRO TERMINAL / CRT PASS */
body:after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:999;
  background:repeating-linear-gradient(to bottom,rgba(80,255,80,.035) 0,rgba(80,255,80,.035) 1px,transparent 1px,transparent 4px);
  mix-blend-mode:screen;opacity:.45;
}
.app{filter:contrast(1.04)}
.header,.module{border-color:#245a28}
.module-title,.badge,.info-value,button,.rail-label b{
  text-shadow:0 0 6px #36ff3655;
}
.header:after{
  content:"SYSTEM ONLINE // SECURE ACCESS";
  position:absolute;right:12px;top:10px;font-size:8px;letter-spacing:1px;color:#397e40;
}
@media(max-width:600px){.header:after{display:none}}
</style>
</head>
<body>
<main class="app" id="lockApp">
  <section class="header">
    <div class="sub">ПРОМЫШЛЕННАЯ СИСТЕМА / ВЕРСИЯ 3.7</div>
    <div class="statusbar">
      <div class="badge">МОДУЛЬ: <strong>ЭЛЕКТРОМЕХАНИЧЕСКИЙ</strong></div>
      <div class="badge">РЕЖИМ: <strong>МЕХАНИЧЕСКИЙ ВЗЛОМ</strong></div>
      <div class="badge">ЭТАП: <strong>1 / 2</strong></div>
      <div class="timer-top" id="timerTop"><span>ОСТАЛОСЬ</span><strong>50</strong><em>SEC</em></div>
    </div>
  </section>

  <section class="module">
    <div class="module-head">
      <div class="module-title">БЛОК СИНХРОНИЗАЦИИ ЗАТВОРОВ</div>
      <div class="module-state" id="stateText">ОЖИДАНИЕ НАСТРОЙКИ</div>
    </div>

    <div class="machine">
      <div class="machine-frame">
        <div class="rails" id="rails"></div>
        <div class="link-layer" id="links"></div>
        <div class="legend">
          <span><i class="box"></i> рабочая позиция</span>
          <span><i class="line"></i> механическая связь</span>
        </div>
      </div>
    </div>

    <div class="info">
      <div class="info-cell"><div class="info-label">СИСТЕМА</div><div class="info-value">ONLINE</div></div>
      <div class="info-cell"><div class="info-label">СОСТОЯНИЕ</div><div class="info-value" id="lockState">ЗАКРЫТО</div></div>
    </div>

    <div class="message" id="message" aria-live="polite"></div>
    <div class="controls">
      <button id="reset">СБРОС</button>
      <button class="primary" id="unlock" disabled>РАЗБЛОКИРОВАТЬ</button>
    </div>
  </section>
</main>

<script>
(() => {
  const root=document.getElementById('lockApp');
  const railsEl=document.getElementById('rails');
  const linksEl=document.getElementById('links');
  const unlock=document.getElementById('unlock');
  const reset=document.getElementById('reset');
  const stateText=document.getElementById('stateText');
  const lockState=document.getElementById('lockState');
  const message=document.getElementById('message');
  const timerTop=document.getElementById('timerTop');
  const timerTopValue=timerTop.querySelector('strong');
  const N=6;
  const targets=[2,1,3,2,4];
  // Одна независимая ось: C5.
  // Связи сохраняют простую механику v1.3.
  const effects={
    0:[1,1,0,0,0], // C1 -> C1 +1, C2 +1
    1:[0,1,1,0,0], // C2 -> C2 +1, C3 +1
    2:[0,-1,1,1,0],// C3 -> C2 -1, C3 +1, C4 +1
    3:[0,0,-1,1,0],// C4 -> C3 -1, C4 +1
    4:[0,0,0,0,1]  // C5 independent
  };
  let pos=[0,0,0,0,0], time=60, solved=false, locked=false, timerId=null;

  const clamp=(v)=>((v%N)+N)%N;

  function build(){
    railsEl.innerHTML='';
    for(let i=0;i<5;i++){
      const wrap=document.createElement('div');
      wrap.className='rail-wrap';
      wrap.innerHTML=`<div class="rail-label"><b>C${i+1}</b><span>${i===4?'IND':'LINK'}</span></div>
        <div class="rail" data-i="${i}"><div class="okmark">✓</div></div>`;
      const rail=wrap.querySelector('.rail');
      for(let p=0;p<N;p++){
        const slot=document.createElement('div');
        slot.className='slot'+(p===targets[i]?' work':'');
        slot.style.top=(18+p*(214/(N-1)))+'px';
        slot.dataset.pos=p;
        slot.innerHTML=`<span class="num">${String(p+1).padStart(2,'0')}</span>`;
        rail.appendChild(slot);
      }
      const h=document.createElement('div');
      h.className='handle'; h.innerHTML='<div class="center"></div>';
      rail.appendChild(h);
      wrap.dataset.index=i;
      railsEl.appendChild(wrap);

      let dragging=false;
      const setFromY=(clientY)=>{
        const r=rail.getBoundingClientRect();
        const y=Math.max(0,Math.min(r.height,clientY-r.top));
        const step=r.height/(N-1);
        const p=clamp(Math.round(y/step));
        move(i,p);
      };
      rail.addEventListener('pointerdown',e=>{dragging=true;rail.setPointerCapture?.(e.pointerId);setFromY(e.clientY);});
      rail.addEventListener('pointermove',e=>{if(dragging)setFromY(e.clientY)});
      rail.addEventListener('pointerup',()=>dragging=false);
      rail.addEventListener('pointercancel',()=>dragging=false);
      rail.addEventListener('click',e=>{if(e.pointerType!=='mouse')return;setFromY(e.clientY)});
    }
    renderLinks();
    render();
  }

  function renderLinks(){
    linksEl.innerHTML='';
    // Approximate visual rods connecting the center axes.
    const width=100/5;
    const y=142;
    [[0,1,'↔'],[1,2,'↔'],[2,3,'↔']].forEach(([a,b,label])=>{
      const x1=(a+.5)*width, x2=(b+.5)*width;
      const line=document.createElement('div');
      line.className='link';
      line.style.left=x1+'%'; line.style.top=y+'px'; line.style.width=(x2-x1)+'%';
      linksEl.appendChild(line);
      const dot1=document.createElement('div');dot1.className='link-dot';dot1.style.left=x1+'%';dot1.style.top=y+'px';
      const dot2=document.createElement('div');dot2.className='link-dot';dot2.style.left=x2+'%';dot2.style.top=y+'px';
      linksEl.append(dot1,dot2);
    });
  }

  function render(){
    [...railsEl.children].forEach((wrap,i)=>{
      const rail=wrap.querySelector('.rail'), h=rail.querySelector('.handle');
      const step=rail.clientHeight/(N-1);
      h.style.top=(pos[i]*step)+'px';
      rail.classList.toggle('correct',pos[i]===targets[i]);
    });
    const all=pos.every((v,i)=>v===targets[i]);
    unlock.disabled=!all||solved;
    stateText.textContent=solved?'ДОСТУП РАЗРЕШЁН':all?'ВСЕ ЗАТВОРЫ СИНХРОНИЗИРОВАНЫ':'ОЖИДАНИЕ НАСТРОЙКИ';
    lockState.textContent=solved?'ОТКРЫТ':'ЗАКРЫТО';
    if(locked){
      message.textContent='СИСТЕМА ЗАБЛОКИРОВАНА';
      message.className='message lockout';
    }else if(all&&!solved){
      message.textContent='ВСЕ ЗАТВОРЫ СИНХРОНИЗИРОВАНЫ';
      message.className='message ok';
    }else{
      message.textContent='';
      message.className='message';
    }
  }

  function move(i,newValue){
    if(solved||locked)return;
    const old=pos[i];
    if(old===newValue)return;
    const delta=(newValue-old+N)%N;
    const signed=delta<=N/2?delta:delta-N;
    const next=pos.slice();
    Object.keys(effects[i]).forEach(k=>{
      const d=effects[i][k]||0;
      next[k]=clamp(next[k]+signed*d);
    });
    pos=next;
    render();
  }

  unlock.addEventListener('click',()=>{
    if(unlock.disabled||locked)return;
    solved=true;
    clearInterval(timerId);
    locked=false;
    stateText.textContent='ДОСТУП РАЗРЕШЁН';
    lockState.textContent='ОТКРЫТ';
    message.textContent='СИСТЕМА РАЗБЛОКИРОВАНА';
    message.className='message ok';
    unlock.textContent='СИСТЕМА РАЗБЛОКИРОВАНА';
  });

  reset.addEventListener('click',()=>{
    pos=[0,0,0,0,0]; time=60;solved=false;locked=false;
    timerTopValue.textContent=time;
    timerTop.classList.toggle('warning',time<=15);
    unlock.textContent='РАЗБЛОКИРОВАТЬ';
    reset.disabled=false;
    clearInterval(timerId);
    timerId=setInterval(()=>{if(!solved&&!locked&&time>0){
      time--; timerTopValue.textContent=time;
      timerTop.classList.toggle('warning',time<=15);
      if(time===0){
        locked=true;
        clearInterval(timerId);
        unlock.disabled=true;
        reset.disabled=false;
        stateText.textContent='СИСТЕМА ЗАБЛОКИРОВАНА';
        lockState.textContent='ЗАБЛОКИРОВАНО';
        timerTop.classList.add('warning');
        message.textContent='СИСТЕМА ЗАБЛОКИРОВАНА';
        message.className='message lockout';
        render();
      }
    }},1000);
    render();
  });

  timerTopValue.textContent=time;
  timerTop.classList.toggle('warning',time<=15);
  build();
  timerId=setInterval(()=>{if(!solved&&!locked&&time>0){
      time--; timerTopValue.textContent=time;
      timerTop.classList.toggle('warning',time<=15);
      if(time===0){
        locked=true;
        clearInterval(timerId);
        unlock.disabled=true;
        reset.disabled=false;
        stateText.textContent='СИСТЕМА ЗАБЛОКИРОВАНА';
        lockState.textContent='ЗАБЛОКИРОВАНО';
        timerTop.classList.add('warning');
        message.textContent='СИСТЕМА ЗАБЛОКИРОВАНА';
        message.className='message lockout';
        render();
      }
    }},1000);
})();
</script>
</body>
</html>
